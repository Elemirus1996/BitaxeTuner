name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: JavaScript-Syntax (Browser-Oberfläche)
        run: |
          Get-ChildItem src/BitaxeTuner.Server/wwwroot -Filter *.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE) { exit 1 } }
      - name: Build & Test
        run: dotnet test BitaxeTuner.sln -c Release
