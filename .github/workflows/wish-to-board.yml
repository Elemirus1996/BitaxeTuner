# Feature-Wünsche (Label „Kundenwunsch“, z. B. über „Wunsch einreichen“ in der App) als Idee aufs Projekt-Board legen.
#
# Braucht das Repo-Secret PROJECT_TOKEN: ein Token mit Schreibrecht auf Projekte (klassisch: Scope „project“; fein:
# „Projects: Read and write“ für das Konto). GITHUB_TOKEN reicht für Benutzer-Projekte nicht. Ohne Secret wird der
# Schritt übersprungen. Titel und Text des Issues werden nie in Befehle eingesetzt – nur die Issue-Adresse.
name: Wunsch aufs Board

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: read

jobs:
  board:
    # Nur beim Anlegen mit Label bzw. wenn genau dieses Label dazukommt – sonst würde ein weiteres Label die Karte
    # wieder auf „Ideen“ zurücksetzen
    if: >-
      (github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'Kundenwunsch')) ||
      (github.event.action == 'labeled' && github.event.label.name == 'Kundenwunsch')
    runs-on: ubuntu-latest
    steps:
      - name: Als Idee aufs Board (Geplant für „Kundenwunsch“)
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_ID: ${{ github.event.issue.node_id }}
          PROJECT_ID: PVT_kwHOBu-fOs4Bk4H-
          STATUS_FIELD: PVTSSF_lAHOBu-fOs4Bk4H-zhjnDYE
          STATUS_IDEEN: b0059fc0
          PLANNED_FIELD: PVTSSF_lAHOBu-fOs4Bk4H-zhjuJAs
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "PROJECT_TOKEN fehlt – übersprungen."; exit 0; fi
          # Nur gh api graphql (reicht mit Scope „project“; „gh project …“ verlangt zusätzlich read:org)
          set_field() {
            gh api graphql -f query='mutation($p:ID!,$i:ID!,$f:ID!,$o:String!){updateProjectV2ItemFieldValue(input:{projectId:$p,itemId:$i,fieldId:$f,value:{singleSelectOptionId:$o}}){projectV2Item{id}}}' \
              -f p="$PROJECT_ID" -f i="$1" -f f="$2" -f o="$3" > /dev/null
          }
          item=$(gh api graphql -f query='mutation($p:ID!,$c:ID!){addProjectV2ItemById(input:{projectId:$p,contentId:$c}){item{id}}}' \
                 -f p="$PROJECT_ID" -f c="$ISSUE_ID" --jq '.data.addProjectV2ItemById.item.id')
          set_field "$item" "$STATUS_FIELD" "$STATUS_IDEEN"
          opt=$(gh api graphql -f query='query($p:ID!){node(id:$p){... on ProjectV2{field(name:"Geplant für"){... on ProjectV2SingleSelectField{options{id name}}}}}}' \
                -f p="$PROJECT_ID" --jq '.data.node.field.options[]? | select(.name=="Kundenwunsch") | .id')
          if [ -n "$opt" ]; then
            set_field "$item" "$PLANNED_FIELD" "$opt"
          else
            echo "Option „Kundenwunsch“ im Feld „Geplant für“ fehlt – nur Status „Ideen“ gesetzt."
          fi
          # Optional: Hinweis per Discord (nur die Issue-Adresse, keine @-Erwähnungen)
          if [ -n "${DISCORD_WEBHOOK:-}" ]; then
            jq -nc --arg url "$ISSUE_URL" '{content: ("💡 Neuer Wunsch auf GitHub: " + $url), allowed_mentions: {parse: []}}' \
              | curl -fsS --max-time 15 -H "Content-Type: application/json" --data-binary @- "$DISCORD_WEBHOOK" > /dev/null || echo "Discord nicht erreichbar"
          fi
