name: Anleitungen (GitHub Pages)

# Veröffentlicht docs/ als Webseite (z. B. die Pico-Lüftersteuerung), sobald sich dort etwas ändert.
# Läuft nur bei öffentlichem Repository (GitHub Pages ist für private Repos im Gratis-Tarif nicht verfügbar).
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
