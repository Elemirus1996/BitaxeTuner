name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build, test, publish & create setups (desktop + server)
        shell: pwsh
        run: ./build.ps1 -Version "${{ github.ref_name }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: BitaxeTuner ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/BitaxeTuner-Setup-*.exe
            artifacts/BitaxeTuner-*-portable-win-x64.zip
            artifacts/BitaxeTuner-Server-Setup-*.exe
            artifacts/BitaxeTuner-Server-*-linux-*.tar.gz
            artifacts/SHA256SUMS.txt

  # Docker-Image für NAS/Home-Server/Raspberry Pi: ghcr.io/<owner>/bitaxetuner-server:<version> und :latest
  docker:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (lowercase)
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bitaxetuner-server" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest

  # Fertiges SD-Karten-Image: Raspberry Pi OS Lite 64-bit + BitaxeTuner-Server (Pi 3/4/5, Zero 2 W)
  pi-image:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4
      - name: Werkzeuge
        run: sudo apt-get update -qq && sudo apt-get install -y -qq parted e2fsprogs xz-utils
      - name: Server-Paket (linux-arm64) aus dem Release holen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --pattern 'BitaxeTuner-Server-*-linux-arm64.tar.gz' --dir pkg
      - name: Image bauen
        run: sudo deploy/pi-image/build-image.sh pkg/BitaxeTuner-Server-*-linux-arm64.tar.gz "$PWD/BitaxeTuner-Server-${GITHUB_REF_NAME#v}-raspios-arm64.img.xz"
      - name: An das Release anhängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" BitaxeTuner-Server-*-raspios-arm64.img.xz BitaxeTuner-Server-*-raspios-arm64.img.xz.sha256 --clobber
