name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # 1. Bauen und testen – ohne Zugriff auf den Signaturschlüssel
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build, test, publish & create setups (desktop + server)
        shell: pwsh
        run: ./build.ps1 -Version "${{ github.ref_name }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          if-no-files-found: error
          retention-days: 7
          path: |
            artifacts/BitaxeTuner-Setup-*.exe
            artifacts/BitaxeTuner-*-portable-win-x64.zip
            artifacts/BitaxeTuner-Server-Setup-*.exe
            artifacts/BitaxeTuner-Server-*-linux-*.tar.gz
            artifacts/update-BitaxeTuner-*
            artifacts/SHA256SUMS.txt

  # 2. Signieren und veröffentlichen (Audit S2): nur in der geschützten Umgebung „release“. Der Schlüssel liegt dort als
  #    Umgebungs-Secret, und jeder Lauf wartet auf die Freigabe des Projektinhabers – ein Tag oder ein kompromittiertes
  #    Token allein erzeugt so kein gültig signiertes Release.
  publish:
    runs-on: ubuntu-latest
    needs: build
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: artifacts

      # Prüfsummen gegen die übergebenen Dateien – signiert wird nur, was wirklich gebaut wurde
      - name: Check SHA256SUMS.txt
        working-directory: artifacts
        run: tr -d '\r' < SHA256SUMS.txt | sha256sum --check --strict -

      # Das Werkzeug prüft die Signatur sofort mit den in der App eingebauten öffentlichen Schlüsseln – passt das Secret
      # nicht, bricht der Release hier ab.
      - name: Sign SHA256SUMS.txt
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: dotnet run --project tools/sign-release -c Release -- artifacts/SHA256SUMS.txt artifacts/SHA256SUMS.txt.sig

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: BitaxeTuner ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/BitaxeTuner-Setup-*.exe
            artifacts/BitaxeTuner-*-portable-win-x64.zip
            artifacts/BitaxeTuner-Server-Setup-*.exe
            artifacts/BitaxeTuner-Server-*-linux-*.tar.gz
            artifacts/update-BitaxeTuner-*
            artifacts/SHA256SUMS.txt
            artifacts/SHA256SUMS.txt.sig

  # Docker-Image für NAS/Home-Server/Raspberry Pi: ghcr.io/<owner>/bitaxetuner-server:<version> und :latest
  docker:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (lowercase)
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bitaxetuner-server" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest

  # Fertiges SD-Karten-Image: Raspberry Pi OS Lite 64-bit + BitaxeTuner-Server (Pi 3/4/5, Zero 2 W)
  pi-image:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Werkzeuge
        run: sudo apt-get update -qq && sudo apt-get install -y -qq parted e2fsprogs xz-utils
      - name: Server-Paket (linux-arm64) aus dem Release holen
        env:
          GH_TOKEN: ${{ github.token }}
        # Die Update-Kopie – so zählt der Image-Bau nicht als Download (Download-Bericht zählt nur Originaldateien)
        run: gh release download "$GITHUB_REF_NAME" --pattern 'update-BitaxeTuner-Server-*-linux-arm64.tar.gz' --dir pkg
      - name: Image bauen
        run: sudo deploy/pi-image/build-image.sh pkg/update-BitaxeTuner-Server-*-linux-arm64.tar.gz "$PWD/BitaxeTuner-Server-${GITHUB_REF_NAME#v}-pi-arm64.img.xz"
      - name: An das Release anhängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" BitaxeTuner-Server-*-pi-arm64.img.xz BitaxeTuner-Server-*-pi-arm64.img.xz.sha256 --clobber
