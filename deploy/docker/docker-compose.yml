# BitaxeTuner-Server mit Docker Compose
#   docker compose up -d
#   docker compose logs bitaxetuner        # Einrichtungs-Code steht hier (auch in /data/SETUP-CODE.txt)
# Update:
#   docker compose pull && docker compose up -d
#
# Zugriff nur aus dem Heimnetz bzw. per VPN – den Port NICHT im Router freigeben.

services:
  bitaxetuner:
    # Feste Version (Audit E3): bei einem Update hier die neue Nummer eintragen; „:latest“ nur bewusst verwenden
    image: ghcr.io/elemirus1996/bitaxetuner-server:0.9.8
    container_name: bitaxetuner
    restart: unless-stopped
    # Obergrenzen, damit ein Fehler nicht den ganzen Rechner ausbremst (ein Pi 4 hat genug Luft)
    mem_limit: 512m
    cpus: 1.0
    ports:
      - "8484:8484"
    volumes:
      - bitaxetuner-data:/data
    # Zusatzlüfter (Raspberry Pi Pico per USB): Gerät durchreichen
    # devices:
    #   - /dev/ttyACM0:/dev/ttyACM0
    # group_add:
    #   - dialout
    environment:
      - TZ=Europe/Berlin
      # - BITAXETUNER_HTTPS=1        # HTTPS fest vorgeben (neue Installationen starten ab 0.9.4 ohnehin mit HTTPS)

volumes:
  bitaxetuner-data:
