# BitaxeTuner (0.9.20): Systemprotokoll übersteht einen Neustart (Raspberry Pi OS hält es sonst nur im
# Arbeitsspeicher – nach einem Absturz war die Ursache nicht mehr zu sehen). Begrenzt, um die Speicherkarte zu schonen.
# Installiert nach /etc/systemd/journald.conf.d/90-bitaxetuner.conf (überstimmt 40-rpi-volatile-storage.conf)
[Journal]
Storage=persistent
SystemMaxUse=48M
SystemKeepFree=512M
MaxFileSec=1week
