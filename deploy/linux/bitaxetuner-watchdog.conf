# BitaxeTuner (0.9.20): Hardware-Watchdog des Rechners einschalten.
# Friert das System ein (z. B. Speicher voll), startet der Watchdog-Chip den Rechner nach 15 s neu,
# statt dass er bis zum Stecker-Ziehen unbedienbar bleibt. Raspberry Pi: höchstens 15 s möglich.
# Installiert nach /etc/systemd/system.conf.d/90-bitaxetuner-watchdog.conf
[Manager]
RuntimeWatchdogSec=15
RebootWatchdogSec=2min
