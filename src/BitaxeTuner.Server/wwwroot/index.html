<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0D1117">
<title>BitaxeTuner</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preload" href="plex-sans-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
</head>
<body>
<div id="backdrop"></div>
<div class="shell bare" id="shell">
  <aside class="side" id="side" hidden>
    <a class="brand" href="#/"><img src="icon.svg" alt=""><div><b>BitaxeTuner</b><small id="version"></small></div></a>
    <nav id="nav" aria-label="Navigation"></nav>
    <div class="grow"></div>
    <button class="nav-btn" id="collapse"><svg class="i"><use href="#i-panel"/></svg><span id="collapseLabel">Einklappen</span></button>
  </aside>
  <div class="mainc">
    <header class="top">
      <img class="brand-sm" src="icon.svg" alt="">
      <div class="page-title"><div class="crumb" id="crumb"></div><h1 id="pageTitle">BitaxeTuner</h1></div>
      <div class="top-actions">
        <span class="chip-stat hide-sm" id="onlineChip" hidden><span id="live" class="live"></span><span id="onlineTxt" class="mono"></span></span>
        <button class="icon-btn" id="bell" hidden><svg class="i"><use href="#i-bell"/></svg><span class="count" id="bellCount" hidden></span></button>
        <button class="user-btn" id="userBtn" hidden><span class="av"><svg class="i"><use href="#i-user"/></svg></span><span class="nm" id="roleName"></span></button>
      </div>
      <div class="popover" id="bellMenu" hidden><h4 id="bellTitle">Hinweise</h4><div id="bellList"></div></div>
      <div class="popover" id="userMenu" hidden>
        <h4 id="userTitle"></h4>
        <label class="pop-row" for="lang"><svg class="i"><use href="#i-globe"/></svg><span id="langLabel">Sprache</span><select id="lang"><option value="de">DE</option></select></label>
        <button class="pop-row" id="theme"><svg class="i"><use href="#i-sun"/></svg><span id="themeLabel">Hell/Dunkel</span><span class="r" id="themeState"></span></button>
        <a class="pop-row" id="lookLink" href="#/settings/look" data-admin><svg class="i"><use href="#i-palette"/></svg><span id="lookLabel">Darstellung …</span></a>
        <button class="pop-row" id="wish"><svg class="i"><use href="#i-gift"/></svg><span id="wishLabel">Wunsch einreichen …</span></button>
        <button class="pop-row" id="installApp"><svg class="i"><use href="#i-download"/></svg><span id="installLabel">Als App installieren …</span></button>
        <button class="pop-row" id="logout"><svg class="i"><use href="#i-out"/></svg><span id="logoutLabel">Abmelden</span></button>
      </div>
    </header>
    <main id="app"><p class="muted center">Lade …</p></main>
    <footer class="status"><span id="statusline"></span><span id="role"></span></footer>
  </div>
</div>
<nav class="tabbar" id="tabbar" hidden></nav>
<div id="toasts" aria-live="polite"></div>
<canvas id="confetti"></canvas>
<dialog id="dialog">
  <form method="dialog">
    <h3 id="dialog-title"></h3>
    <div id="dialog-body"></div>
    <div class="dialog-actions">
      <button value="cancel" class="btn ghost">Abbrechen</button>
      <button value="ok" id="dialog-ok" class="btn primary">OK</button>
    </div>
  </form>
</dialog>
